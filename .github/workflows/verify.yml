name: Verify

# The full check suite, called by ci.yml on push/PR and by release.yml before it builds anything.
# Both callers run the same jobs, so a tag cannot ship an artifact that would have failed CI.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  source-checks:
    name: lint, format, typecheck, and audit (windows)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The whole history, so coverage:check can find the commit this change starts from.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x
          cache: npm

      - name: Verify lockfile matches package.json
        run: npm run lockfile:check

      - name: Every override still narrows a dependency
        run: npm run overrides:check

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:check

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      # Typecheck is not bundling, so a rollup or terser failure is invisible until a version tag
      # asks for an artifact. electron-vite build rather than npm run build, which typechecks again.
      - name: Bundle
        run: npx electron-vite build

      - name: Explicit any budget
        run: npm run any:budget

      - name: Type escape budget
        run: npm run type-escape:budget

      - name: File size budget
        run: npm run size:budget

      - name: Referenced paths are tracked
        run: npm run paths:check

      # The branch as it stood before the push, or the target of a pull request, so a threshold
      # lowered on development itself is still held to what development had.
      - name: Coverage settings do not loosen
        run: npm run coverage:check
        env:
          COVERAGE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}

      - name: Security audit
        run: npm run audit:check

  test:
    name: test
    # Deliberately not gated on source-checks, so tests report on every push whatever lint,
    # format and audit do. all-checks-passed requires both jobs to succeed.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [22.x]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run test:coverage -- --randomize

  all-checks-passed:
    name: all checks passed
    needs: [source-checks, test]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [ "${{ needs.source-checks.result }}" != "success" ] || [ "${{ needs.test.result }}" != "success" ]; then
            echo "One or more required checks failed"
            exit 1
          fi
