name: Build packages

# Packaging smoke, weekly and by hand: verify electron-builder can complete per platform.
# Pushing version tags also runs `.github/workflows/release.yml` (macOS + Windows installers only; Linux is not part of that release).
# The weekly run is what builds the Linux package, since no release does.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build: npm run build:linux
          - os: macos-latest
            build: npm run build:mac
          - os: windows-latest
            build: npm run build:win
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: ${{ matrix.build }}

      - name: Check the package carries only what ships
        run: npm run package:check
