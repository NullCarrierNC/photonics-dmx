appId: rocks.photonics
productName: Photonics
asar: true
# Fuses baked into the Electron binary. Off: running it as plain Node, NODE_OPTIONS and --inspect,
# each a way to run other code with the app's own permissions, and the extra privileges file://
# pages get, since the renderer loads from the photonics:// scheme instead. On: the archive
# integrity check and loading the app from app.asar alone. tools/packaged-files-check.mjs reads
# them back. enableCookieEncryption stays at Electron's default, since it keys cookies from the
# macOS keychain, which can prompt on an unsigned build. Once set here, the check holds it on.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
  resetAdHocDarwinSignature: true
directories:
  buildResources: build
# Everything the app loads at runtime resolves under out/, which the build writes. package.json is
# what Electron reads for main, and the licence files travel with the app for GPL compliance.
# Production node_modules are collected separately by electron-builder and must not be named here.
# This list is what ships, so a working copy holding anything else packs the same app either way.
files:
  - 'out/**'
  - '!out/**/*.map'
  # TypeScript build state, if an editor or a stray tsc run leaves any under out/. The project
  # source paths it lists have no business in a shipped app.
  - '!out/types/**'
  - '!out/**/*.tsbuildinfo'
  - 'package.json'
  - 'LICENSE'
  - 'THIRD-PARTY-LICENSES.md'
asarUnpack:
  - '**/*.node'
  - '**/node_modules/@serialport'
extraResources:
  - from: resources/defaults
    to: defaults
    filter:
      - '**/*'
win:
  executableName: Photonics
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  oneClick: false
  perMachine: true
  allowElevation: true
  allowToChangeInstallationDirectory: true
mac:
  # Builds are never signed with a certificate. null stops electron-builder searching the keychain
  # for an identity, and the fuse step leaves the app ad-hoc signed, which Apple Silicon requires.
  identity: null
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
  hardenedRuntime: true
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: Null Carrier
  category: Entertainment
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: true
